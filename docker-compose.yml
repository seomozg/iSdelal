version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - '6333:6333'  # HTTP API
      - '6334:6334'  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rag-backend
    env_file: ./backend/.env
    environment:
      - ALLOW_ALL_ORIGINS=true
    ports:
      - '8000:8000'
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./widget:/app/widget:ro
      - ./click-ai-widget/dist:/app/landing:ro
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Standalone document bot: manage collections/documents, answer questions.
  # Same image as backend, but runs `python -m app.docbot` (long polling, no HTTP).
  docbot:
    build: ./backend
    container_name: rag-docbot
    command: python -m app.docbot
    env_file:
      - ./backend/.env        # shared: QDRANT_*, JINA, DEEPSEEK, EMBED_MODEL, limits
      - ./backend/.env.docbot  # override: TG_BOT_TOKEN for this bot
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/docbot.db
    depends_on:
      - qdrant
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
